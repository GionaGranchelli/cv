    school: University of Technology
    period: 2018 - 2020
    location: City, Country
    note: cum laude
    details: Distributed Systems, Machine Learning, Software Architecture
    thesis: A Novel Approach to Distributed Consensus
    supervisors: Prof. Jane Smith

  - degree: BSc Computer Science
    school: University of Technology
    period: 2015 - 2018
    location: City, Country

publications:
  - title: A Novel Approach to Distributed Consensus
    venue: Proceedings of the International Conference on Distributed Systems, 2020
    url: https://example.com/paper.pdf

articles:
  - slug: my-first-article
    title: My First Technical Article
    description: A deep dive into something interesting.
    date: "2025-06-15"
    readingTime: 8 min read
    tags:
      - Engineering
      - Architecture
    content: |
      <h2>Introduction</h2>
      <p>This is where your article content goes. Full HTML is supported.</p>
      <p>Write as much as you want — this becomes a full SEO-optimized page.</p>

tour:
  enabled: true
  steps:
    - command: about
      delay: 3500
    - command: skills
      delay: 3500
    - command: experience acme-corp
      delay: 5000
    - command: projects
      delay: 4000
    - command: education
      delay: 4000
    - command: contact
      delay: 4000
