# terminal-cv configuration
# Copy this file to cv.yaml, edit it, then run: npx create-terminal-cv --config cv.yaml
# Schema: schema/cv.schema.json

profile:
  name: Your Name
  title: Your Professional Title
  tagline: A short tagline that appears in the terminal header
  photo: photo.jpg
  siteUrl: https://yoursite.com
  siteName: Your Name | Your Title

socials:
  email: you@example.com
  linkedin: your-linkedin-handle
  github: your-github-handle
  twitter: your-twitter-handle

bootSequence:
  - "[ ok ] Mounting profile data"
  - "[ ok ] Loading experience blocks"
  - "[ ok ] Terminal ready"

skills:
  - TypeScript
  - React
  - Node.js
  - Python
  - PostgreSQL
  - Docker
  - AWS

agenticSkills: |
  <b>Agentic Workflows</b>: Building autonomous engineering assistants.<br>
  <b>Context Engineering</b>: Designing surgical retrieval patterns for LLM context.<br>
  <b>Tool-Augmented LLMs</b>: CLI-first execution bridges for agentic actions.

experiences:
  - company: Acme Corp
    role: Senior Software Engineer
    period: Jan 2023 - Now
    location: San Francisco, CA
    summary: Leading the platform team to build scalable cloud infrastructure.
    bullets:
      - Designed and implemented microservices architecture serving 1M+ users
      - Migrated legacy monolith to Kubernetes on AWS EKS
      - Built CI/CD pipelines reducing deployment time by 70%
    stack:
      - Go
      - Kubernetes
      - AWS
      - Terraform
      - PostgreSQL
    achievements:
      - Reduced infrastructure costs by 40% through spot instance optimization
      - Achieved 99.99% uptime for critical services
    challenges:
      - Navigating a complex multi-cloud migration with zero downtime
    impact: Transformed the platform from a single-point-of-failure monolith to a resilient distributed system.
    content: |
      <h3>Building the Platform Team</h3>
      <p>In this role, I built and led the platform engineering team responsible for the infrastructure that powers all of Acme Corp's products.</p>
      <p>The key challenge was migrating a decade-old monolith to a modern, scalable architecture without disrupting the business.</p>

  - company: StartupXYZ
    role: Full Stack Developer
    period: Jun 2020 - Dec 2022
    location: Remote
    summary: Core engineer on a fintech platform serving 100K daily users.
    bullets:
      - Built payment processing backend handling $10M+ monthly volume
      - Developed real-time dashboards with WebSockets
      - Implemented fraud detection algorithms
    stack:
      - TypeScript
      - React
      - Node.js
      - PostgreSQL
      - Redis
      - Docker

